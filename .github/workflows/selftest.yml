# selftest.yml — rust.yml gates ITSELF.
#
# Every caller in the org depends on rust.yml@main, so a bad merge here breaks
# every repo at once. This runs the reusable workflow, on every push and PR to
# this repo, against fixtures/selftest with EVERY input switched on — so every
# job rust.yml can emit runs on every change to it. A PR here merges on a green
# verdict of exactly the checks a caller would see. One job beside it,
# `forbid-not-vacuous`, checks the fixture itself (see its comment).
#
# The job id is `ci` on purpose: check names are `<caller job id> / <job name>`,
# so this run shows the names every migrated repo will show — `ci / doc`,
# `ci / features: extra`, `ci / msrv 1.80` — and verdict.sh sees the real thing.
name: selftest

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: selftest-${{ github.ref }}
  # Never cancel a main run: a main commit without a verdict is the bug that
  # `cancel-in-progress: true` planted in two repos.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/rust.yml
    with:
      path: fixtures/selftest
      features: "extra *"
      wasm-lib: true
      wasm-features: extra
      wasm-packages: selftest-wasmlib # the ONE wasm-clean member, by PACKAGE name (not its directory) — exercises the -p path
      wasm-check: true
      macos: true
      test-args: --all-targets
      no-default-features: true
      # A name and a wildcard, both matching the fixture's default-only dependency.
      no-default-features-forbid: "selftest-heavy selftest-hea*"

  # `ci / no default features` proves the forbid list is absent from that build; it is
  # evidence only if the forbidden package IS in the default build, or the check is green
  # by vacuity (a renamed fixture crate would leave it passing forever). Not a job rust.yml
  # can run on itself: it needs to know the fixture.
  forbid-not-vacuous:
    name: fixture forbid list is linked by the default build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: fixtures/selftest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: the default tree names selftest-heavy
        run: |
          tree="$(cargo tree --workspace -e normal --prefix none)"
          grep '^selftest-heavy ' <<<"$tree"
