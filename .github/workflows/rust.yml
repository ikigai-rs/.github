# rust.yml — the ONE Rust CI for every ikigai-rs repository.
#
# WHY. Thirty-two repos each carried a hand-copied ci.yml, and the copies drifted:
# `cancel-in-progress: true` on main (a main commit can go without a verdict), no
# `cargo doc` gate anywhere, feature-gated targets that `--all-targets` cannot see
# handled three different ways, an MSRV declared in one repo and tested nowhere.
# Every one of those is a gate that silently covers less than it looks like it does,
# and every one recurs because CI is copied. This file is where it is fixed once.
#
# A caller's ci.yml is three lines (see the template below). Non-cargo jobs — a
# walkthrough-anchor check, a JS parity suite, an elisp byte-compile — stay in the
# caller, unchanged. This file owns the CARGO gates and nothing else.
#
#   jobs:
#     ci:
#       uses: ikigai-rs/.github/.github/workflows/rust.yml@main
#       with: { wasm-lib: true }          # only the inputs the repo needs
#
# `@main`, DELIBERATELY. One fix here propagates to every repo on its next run —
# that is the entire point. The cost is that a bad merge to this file breaks every
# repo at once; it is paid by selftest.yml (this workflow gates itself on every
# change, on every job it can emit) and by revert being one commit. A tag would mean
# thirty-two PRs per fix, which is the disease this file cures.
#
# FIXED — no input can turn these off:
#   fmt · clippy · test    fmt --check; clippy --workspace --all-targets -D warnings;
#                          test --workspace. `--workspace` always: harmless on a
#                          single crate, and a root-package workspace is otherwise
#                          linted at the root only.
#   doc                    RUSTDOCFLAGS=-D warnings cargo doc --workspace --no-deps.
#                          A broken intra-doc link is a defect in a published crate.
#                          There is no `doc: false`: a repo that cannot pass fixes its
#                          docs, or keeps a visibly dated inline exemption that
#                          `just ci-drift` reports. Never a silent one.
#                          ⚠ It builds DEFAULT features only, so it never compiles a
#                          feature-gated module; each `features:` set re-runs it below.
#   msrv <ver>             AUTOMATIC. If any workspace member declares `rust-version`,
#                          clippy + test run on that toolchain. No input: the manifest
#                          is the truth, so the gate cannot drift from it. Skipped
#                          (visibly) when nothing declares one.
#
# INPUTS — all optional, one line of WHY each:
#   path           Working directory, for a repo whose Cargo project is not at root.
#   test-args      Appended to EVERY `cargo test` this workflow runs (tutorial needs
#                  `--all-targets`). ⚠ `--all-targets` silently excludes doctests, so
#                  when it is present a separate `cargo test --doc` step runs too.
#   features       Whitespace-separated feature SETS (features within a set are
#                  comma-separated, as cargo takes them): "migrate", "server
#                  maintenance", "module". A literal `*` means `--all-features`. Each
#                  set is one job `features: <set>` running clippy --all-targets, test
#                  AND doc (-D warnings) with that set — a broken intra-doc link inside
#                  a feature-gated module is invisible to the default `doc` job
#                  (ikigai-cms-web shipped twelve under `server`). This is §9c made
#                  structural: a target behind `required-features` gets an
#                  unconditional job, or the caller has not listed its feature. A bare
#                  feature name applies to every member that declares it (cargo errors
#                  only when NONE does); use `crate/feature` to target one member.
#   wasm-lib       Job `wasm32 lib clippy`: clippy --workspace --lib on
#                  wasm32-unknown-unknown. The module crates' gate.
#   wasm-features  Features for the wasm-lib job only (jsonld and xslt lint their
#                  wasm face under `--features module`).
#   wasm-packages  Space-separated package names for the wasm-lib job; when set the
#                  job lints `-p <each>` instead of `--workspace` (a workspace with ONE
#                  wasm face beside native-only members — ikigai-tutorial's book-wasm
#                  next to two-hosts, which pulls quinn/mio and cannot build on wasm32).
#   wasm-check     Job `wasm32 check`: cargo check --workspace on wasm32. Core's
#                  gate. ⚠ A compile-only wasm gate cannot see a runtime panic —
#                  `SystemTime::now()` compiles on wasm and panics when called. It
#                  is what it is; say so rather than reading more into green.
#   macos          Job `clippy · test (macOS, default)` on macos-latest, plus one
#                  `clippy · test (macOS, <set>)` per feature set. macOS minutes are
#                  FREE on public repos and BILLED on private ones (ikigai-secret,
#                  ikigai-programs).
#   no-default-features
#                  Job `no default features`: clippy --all-targets, test and doc
#                  (-D warnings), all `--workspace --no-default-features`, plus the
#                  wasm32 lib clippy under the same flag when `wasm-lib` is set (scoped
#                  by `wasm-packages`, WITHOUT `wasm-features`: those are additive and
#                  would turn back on what this job exists to leave off). For a crate
#                  whose default feature carries a heavy surface and whose consumers
#                  take `default-features = false` (ikigai-sexpr's arrangement build,
#                  ikigai-shacl's subset validator, ikigai-layers' participant): every
#                  other job here builds the defaults, and the `features` input can add
#                  features but never remove the default. ⚠ Not combined with any
#                  `features` set, not run on macOS, not run at the msrv: one leg.
#   no-default-features-forbid
#                  Whitespace-separated package names that must NOT appear in that
#                  build's `cargo tree --workspace -e normal` (host target, normal edges:
#                  what a consumer links). `*` is a wildcard inside a name (`rudof_*`).
#                  The point of turning a default off is usually what it keeps OUT, and
#                  a lint cannot see a dependency creep back in. The check is positive:
#                  the tree must print and name every workspace member, so a failing
#                  `cargo tree` cannot read as "absent". Requires `no-default-features:
#                  true`; given without it, `plan` fails rather than ignore it.
#
# CHECK NAMES as a PR sees them (verdict.sh reads these by name): the caller's job
# id, a slash, the job name here — `ci / plan`, `ci / fmt · clippy · test`,
# `ci / doc`, `ci / msrv 1.89`, `ci / features: extra`, `ci / wasm32 lib clippy`,
# `ci / wasm32 check`, `ci / clippy · test (macOS, default)`,
# `ci / no default features`. Keep the caller's job id `ci`.
# ⚠ A SKIPPED job's name is shown with its expression UNEVALUATED — a repo with no
# features sees `ci / features: ${{ matrix.set }}` (skipped), one with no
# rust-version sees `ci / msrv ${{ needs.plan.outputs.msrv }}` (skipped). Seen on the
# private-caller probe 2026-09-09. verdict.sh counts skipped as a pass, and the
# names here are chosen to still read as what they are in that raw form — which is
# why the macOS name is a plain `(macOS, ${{ matrix.set }})` and not a ternary.
#
# Every `run:` here is `shell: bash` explicitly, which gives `-eo pipefail`; the
# default shell for an unspecified `run:` is `bash -e` WITHOUT pipefail, and the
# plan step below is a pipeline whose failure must not read as "no features".

name: rust

on:
  workflow_call:
    inputs:
      path:
        type: string
        default: "."
        description: Working directory of the Cargo project (repo root by default)
      test-args:
        type: string
        default: ""
        description: Appended to every `cargo test`; `--all-targets` also triggers a doctest step
      features:
        type: string
        default: ""
        description: Whitespace-separated feature sets, each a job; `*` = --all-features
      wasm-lib:
        type: boolean
        default: false
        description: Lint the lib on wasm32-unknown-unknown
      wasm-features:
        type: string
        default: ""
        description: Features for the wasm-lib job (e.g. `module`)
      wasm-packages:
        type: string
        default: ""
        description: Packages for the wasm-lib job (space-separated); empty = --workspace
      wasm-check:
        type: boolean
        default: false
        description: cargo check --workspace on wasm32-unknown-unknown
      macos:
        type: boolean
        default: false
        description: Also clippy + test on macos-latest (billed on private repos)
      no-default-features:
        type: boolean
        default: false
        description: Also clippy, test and doc with --no-default-features (and wasm32 lib clippy if wasm-lib)
      no-default-features-forbid:
        type: string
        default: ""
        description: Packages (space-separated, `*` wildcard) that must not be in the --no-default-features tree

# CREDENTIALS (ledger #1725). Every job here compiles the caller's lock, so every build
# script and proc macro in it runs with whatever the job holds. Two rules:
#   - `contents: read` and nothing more, for every job: each one checks out the caller,
#     which needs it when the caller is private. A called workflow can only narrow the
#     caller's token, so this caps it whatever the caller grants.
#   - every actions/checkout says `persist-credentials: false`. The default writes the
#     token into the checkout's `.git/config` as an extraheader, readable by any build
#     script for the whole job; no step here runs git after the checkout, so nothing
#     needs it. selftest.yml's `checkout credentials` job refuses a checkout without it.
# ⚠ What this does NOT do: the job still holds its token (contents: read on the caller)
# and the Actions runtime token, in the runner's memory, and a hosted runner gives the
# job's code passwordless sudo. Taking the token out of the build entirely means a
# checkout job handing the source to `permissions: {}` build jobs, as devtools'
# stranger build does (ledger #1722).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Turns the inputs and the manifest into the matrix the jobs below consume:
  # the feature sets as JSON, the same list with a `default` sentinel in front
  # for the macOS matrix, and the highest `rust-version` any member declares.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.plan.outputs.features }}
      macos-sets: ${{ steps.plan.outputs.macos-sets }}
      msrv: ${{ steps.plan.outputs.msrv }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.path }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - id: plan
        env:
          FEATURES: ${{ inputs.features }}
          NO_DEFAULT: ${{ inputs.no-default-features }}
          FORBID: ${{ inputs.no-default-features-forbid }}
        run: |
          set -euo pipefail
          # A forbid list is checked only by the no-default-features job; given alone it
          # would be ignored without a word, which is the failure this file exists to stop.
          if [ -n "${FORBID//[[:space:]]/}" ] && [ "$NO_DEFAULT" != "true" ]; then
            echo "::error::no-default-features-forbid is set but no-default-features is not: nothing would check it. Add \`no-default-features: true\`."
            exit 1
          fi
          sets="$(jq -cn --arg s "$FEATURES" '$s | [splits("\\s+")] | map(select(length > 0))')"
          macos_sets="$(jq -cn --argjson s "$sets" '["default"] + $s')"
          # Highest rust-version across the workspace, compared numerically —
          # a string max would rank 1.9 above 1.10.
          msrv="$(cargo metadata --no-deps --format-version 1 \
                  | jq -r '[.packages[].rust_version // empty | split(".") | map(tonumber)]
                           | max // empty | map(tostring) | join(".")')"
          echo "feature sets: $sets"
          echo "msrv:         ${msrv:-(none declared)}"
          {
            echo "features=$sets"
            echo "macos-sets=$macos_sets"
            echo "msrv=$msrv"
          } >> "$GITHUB_OUTPUT"

  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.path }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.path }}
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace ${{ inputs.test-args }}
      # `--all-targets` excludes doctests (cargo's documented behaviour, and the
      # selftest fixture proves it). A repo that asks for it would otherwise never
      # run a doctest again, silently.
      - name: doctests (excluded by --all-targets)
        if: contains(inputs.test-args, '--all-targets')
        run: cargo test --workspace --doc

  doc:
    name: doc
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.path }}
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.path }}
      - name: cargo doc
        run: cargo doc --workspace --no-deps

  features:
    name: "features: ${{ matrix.set }}"
    needs: plan
    if: needs.plan.outputs.features != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJSON(needs.plan.outputs.features) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.path }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.path }}
          key: features-${{ matrix.set }}
      - id: flags
        env:
          SET: ${{ matrix.set }}
        run: |
          if [ "$SET" = "*" ]; then echo "flags=--all-features" >> "$GITHUB_OUTPUT"
          else echo "flags=--features $SET" >> "$GITHUB_OUTPUT"; fi
      - name: clippy (${{ matrix.set }})
        run: cargo clippy --workspace --all-targets ${{ steps.flags.outputs.flags }} -- -D warnings
      - name: test (${{ matrix.set }})
        run: cargo test --workspace ${{ steps.flags.outputs.flags }} ${{ inputs.test-args }}
      - name: doc (${{ matrix.set }})
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps ${{ steps.flags.outputs.flags }}

  msrv:
    name: msrv ${{ needs.plan.outputs.msrv }}
    needs: plan
    if: needs.plan.outputs.msrv != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.path }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # `@master` is the documented form for a dynamic toolchain; `@stable` and
      # friends are the fixed-version aliases of the same action.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.plan.outputs.msrv }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.path }}
          key: msrv
      - name: clippy (msrv)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (msrv)
        run: cargo test --workspace ${{ inputs.test-args }}

  wasm-lib:
    name: wasm32 lib clippy
    if: inputs.wasm-lib
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.path }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.path }}
          key: wasm-lib
      - name: clippy (wasm32 lib)
        # `wasm-packages` narrows the lint to the members that HAVE a wasm face; the
        # default is the whole workspace. Expanded in bash so a list of names becomes
        # a list of `-p` flags without a YAML expression doing string surgery.
        env:
          WASM_PACKAGES: ${{ inputs.wasm-packages }}
          WASM_FEATURES: ${{ inputs.wasm-features }}
        run: |
          scope=(--workspace)
          if [ -n "${WASM_PACKAGES// /}" ]; then
            scope=()
            for pkg in $WASM_PACKAGES; do scope+=(-p "$pkg"); done
          fi
          feats=()
          if [ -n "$WASM_FEATURES" ]; then
            if [ -n "${WASM_PACKAGES// /}" ]; then
              # A feature named for a `-p` member from a virtual workspace root must be
              # spelled `package/feature`, or cargo refuses ("cannot specify features
              # for packages outside of workspace").
              for pkg in $WASM_PACKAGES; do for f in $WASM_FEATURES; do feats+=(--features "$pkg/$f"); done; done
            else
              feats=(--features "$WASM_FEATURES")
            fi
          fi
          cargo clippy "${scope[@]}" --lib --target wasm32-unknown-unknown "${feats[@]}" -- -D warnings

  wasm-check:
    name: wasm32 check
    if: inputs.wasm-check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.path }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.path }}
          key: wasm-check
      - name: check (wasm32)
        run: cargo check --workspace --target wasm32-unknown-unknown

  # The build a `default-features = false` consumer links. A static name, so the
  # skipped state reads as what it is (every caller that does not ask sees
  # `ci / no default features` skipped). No `needs: plan`: the forbid-without-this
  # refusal lives in plan, and this job has nothing to wait for.
  no-default-features:
    name: no default features
    if: inputs.no-default-features
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.path }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # Installed unconditionally: a target is seconds, and an expression here that
          # evaluates to "" is one more thing to get wrong in the file every repo calls.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.path }}
          key: no-default-features
      - name: clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: test (no default features)
        run: cargo test --workspace --no-default-features ${{ inputs.test-args }}
      - name: doctests (no default features; excluded by --all-targets)
        if: contains(inputs.test-args, '--all-targets')
        run: cargo test --workspace --no-default-features --doc
      - name: doc (no default features)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --no-default-features
      - name: wasm32 lib clippy (no default features)
        if: inputs.wasm-lib
        env:
          WASM_PACKAGES: ${{ inputs.wasm-packages }}
        run: |
          scope=(--workspace)
          if [ -n "${WASM_PACKAGES// /}" ]; then
            scope=()
            for pkg in $WASM_PACKAGES; do scope+=(-p "$pkg"); done
          fi
          cargo clippy "${scope[@]}" --lib --target wasm32-unknown-unknown --no-default-features -- -D warnings
      - name: tree (no default features) links none of the forbidden packages
        if: inputs.no-default-features-forbid != ''
        env:
          FORBID: ${{ inputs.no-default-features-forbid }}
        run: |
          # `read -a`, never an unquoted `for p in $FORBID`: that would glob-expand
          # `rudof_*` against the files in this directory before the check saw it.
          read -ra pats <<<"$FORBID"
          alts=()
          for p in "${pats[@]}"; do
            if [[ ! $p =~ ^[A-Za-z0-9_*-]+$ ]]; then
              echo "::error::no-default-features-forbid: \`$p\` is not a package name (letters, digits, _ and -, with * as a wildcard)"
              exit 1
            fi
            alts+=("${p//\*/[A-Za-z0-9_-]*}")
          done
          # Positive: the tree must print and must name every workspace member, so a
          # failing or empty `cargo tree` cannot read as "nothing forbidden".
          tree="$(cargo tree --workspace --no-default-features -e normal --prefix none)"
          members="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name')"
          while IFS= read -r m; do
            if ! grep -q "^$m " <<<"$tree"; then
              echo "::error::\`cargo tree --workspace --no-default-features\` does not name workspace member $m; refusing to call the tree clean"
              exit 1
            fi
          done <<<"$members"
          if [ "${#alts[@]}" -eq 0 ]; then
            echo "no patterns to check"
            exit 0
          fi
          re="^($(IFS='|'; printf '%s' "${alts[*]}")) "
          echo "forbidden: $re"
          if hits="$(grep -E "$re" <<<"$tree")"; then
            echo "::error::the --no-default-features build links packages listed in no-default-features-forbid:"
            sort -u <<<"$hits"
            exit 1
          fi
          echo "none of them in the tree"

  # One macOS job for the default feature set, plus one per listed set: a repo whose
  # Linux gate runs `--all-features` (cli) would otherwise have its macOS gate
  # quietly cover less. `default` is a SENTINEL meaning "no feature flags" — cargo
  # rejects `--features default` on a crate that declares no default feature.
  macos:
    name: "clippy · test (macOS, ${{ matrix.set }})"
    needs: plan
    if: inputs.macos
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJSON(needs.plan.outputs.macos-sets) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.path }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.path }}
          key: macos-${{ matrix.set }}
      - id: flags
        env:
          SET: ${{ matrix.set }}
        run: |
          case "$SET" in
            default) echo "flags=" >> "$GITHUB_OUTPUT" ;;
            "*")     echo "flags=--all-features" >> "$GITHUB_OUTPUT" ;;
            *)       echo "flags=--features $SET" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: clippy (macOS)
        run: cargo clippy --workspace --all-targets ${{ steps.flags.outputs.flags }} -- -D warnings
      - name: test (macOS)
        run: cargo test --workspace ${{ steps.flags.outputs.flags }} ${{ inputs.test-args }}
